name: Bootstrap React Island (temporary)

on:
  push:
    branches: [issue-129-react-ilha-imoveis]
    paths:
      - ".github/workflows/bootstrap-react-island.yml"
      - "package.json"
      - "src/react/portfolio-stats.tsx"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Resolver versões exatas no npm e atualizar package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Instalar e compilar a ilha React
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:react
      - name: Versionar lockfile e JavaScript produzido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json portfolio-react.js
          if ! git diff --cached --quiet; then
            git commit -m "build(react): fixar lockfile e bundle da ilha imobiliaria"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Salvar artefatos para auditoria
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-island-build
          path: |
            package-lock.json
            portfolio-react.js
          retention-days: 3
