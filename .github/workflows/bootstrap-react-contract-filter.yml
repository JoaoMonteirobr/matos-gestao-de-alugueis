name: Bootstrap React Contract Filter (temporary)

on:
  push:
    branches: [issue-133-react-filtro-contratos]
    paths:
      - ".github/workflows/bootstrap-react-contract-filter.yml"
      - "src/react/portfolio-stats.tsx"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Compilar componente React sem alterar dependências
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:react
      - name: Versionar pacote gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-react.js
          if ! git diff --cached --quiet; then
            git commit -m "build(react): atualizar bundle dos filtros de contratos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
